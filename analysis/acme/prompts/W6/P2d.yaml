paradigm: P2d
wording: W6
response_type: number
intro: We're curious about what people believe about the world around them. For this question, a best estimate is what's wanted from you. If the correct answer isn't known to you, just give your best guess.
conditions:
  x1: Under 50,000 babies get born each day in the United States. How many babies do you think get born in the U.S. each day?
  x0: Over 100 babies get born each day in the United States. How many babies do you think get born in the U.S. each day?
condition_names:
  x1: high anchor
  x0: low anchor
baseline: So how many babies do you think get born in the U.S. each day?
