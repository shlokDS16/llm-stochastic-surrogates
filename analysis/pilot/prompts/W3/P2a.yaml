paradigm: P2a
wording: W3
response_type: number
intro: We are interested in what people believe about the world around them. Please estimate the answer to the question below, and if you do not know it, just give your best guess.
conditions:
  x1: Consider the distance from San Francisco to New York City, which is shorter than 6,000 miles. How far do you think it is?
  x0: Consider the distance from San Francisco to New York City, which is longer than 1,500 miles. How far do you think it is?
condition_names:
  x1: high anchor
  x0: low anchor
