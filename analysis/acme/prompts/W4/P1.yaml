paradigm: P1
wording: W4
response_type: choice
stem: 'Imagine that preparations are being made in the United States for the outbreak of an unusual disease, by which 600 people are expected to be killed. Two alternative programs to fight the disease have been proposed. Assume that the exact scientific estimates of the consequences of the programs are as follows:'
question: Which program would be chosen by you?
frames:
  x1:
    name: gain
    labels:
    - A
    - B
    sure: If Program {L} is adopted, 200 people will be saved.
    risky: If Program {L} is adopted, 600 people will be saved with 1/3 probability, and no people will be saved with 2/3 probability.
  x0:
    name: loss
    labels:
    - C
    - D
    sure: If Program {L} is adopted, 400 people will die.
    risky: If Program {L} is adopted, no people will die with 1/3 probability, and 600 people will die with 2/3 probability.
order_note: O=sure_first puts the sure program on the first label; O=risky_first swaps the two lines (labels stay in order).
