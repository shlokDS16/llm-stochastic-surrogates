paradigm: P1
wording: W9
response_type: choice
stem: 'The United States is getting ready for the outbreak of a rare illness that''s expected to kill 600 people. To fight it, two alternative programs have been put forward. Let''s say the exact scientific estimates of how the programs would turn out are these:'
question: Out of the two programs, which would you go for?
frames:
  x1:
    name: gain
    labels:
    - A
    - B
    sure: 200 people will get saved if Program {L} goes ahead.
    risky: There's a 1/3 chance that 600 people will get saved and a 2/3 chance that nobody will get saved if Program {L} goes ahead.
  x0:
    name: loss
    labels:
    - C
    - D
    sure: 400 people will die if Program {L} goes ahead.
    risky: There's a 1/3 chance that nobody will die and a 2/3 chance that 600 people will die if Program {L} goes ahead.
order_note: O=sure_first puts the sure program on the first label; O=risky_first swaps the two lines (labels stay in order).
