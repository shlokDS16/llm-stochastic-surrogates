paradigm: P4
wording: W4
response_type: number
conditions:
  x1: Imagine that you are in a casino and a man rolling dice is passed by you. Three dice are rolled by him, and all three come up 6's. Based on your imagined scenario, how many times do you think the dice had been rolled by the man before you walked by?
  x0: Imagine that you are in a casino and a man rolling dice is passed by you. Three dice are rolled by him, and one comes up 3, and two come up 6's. Based on your imagined scenario, how many times do you think the dice had been rolled by the man before you walked by?
condition_names:
  x1: three 6s
  x0: one 3 and two 6s
