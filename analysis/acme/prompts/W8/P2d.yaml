paradigm: P2d
wording: W8
response_type: number
intro: Should you not know the correct answer, simply give your best guess. People's beliefs about the world around them are of interest to us, and for the following question we ask that you give your best estimate.
conditions:
  x1: Per day in the United States, fewer than 50,000 babies are born. How many babies do you think are born in the U.S. each day?
  x0: Per day in the United States, more than 100 babies are born. How many babies do you think are born in the U.S. each day?
condition_names:
  x1: high anchor
  x0: low anchor
baseline: Each day in the U.S., how many babies do you think are born?
