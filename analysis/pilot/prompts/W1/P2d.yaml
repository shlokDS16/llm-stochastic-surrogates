paradigm: P2d
wording: W1
response_type: number
intro: We would like to know what people believe about the world around them. Please give your best estimate for the following question. If you do not know the answer, just make your best guess.
conditions:
  x1: Fewer than 50,000 babies are born each day in the United States. What is your estimate of the number of babies born in the U.S. per day?
  x0: More than 100 babies are born each day in the United States. What is your estimate of the number of babies born in the U.S. per day?
condition_names:
  x1: high anchor
  x0: low anchor
