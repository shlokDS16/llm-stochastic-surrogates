paradigm: P1
wording: W7
response_type: choice
stem: 'Preparing for the outbreak of an unusual illness that is expected to kill 600 people, the United States has proposed two alternative programs to fight it. Assume that the exact scientific estimates of the consequences are as follows:'
question: Of the two programs, which would you choose?
frames:
  x1:
    name: gain
    labels:
    - A
    - B
    sure: 200 people will be rescued if Program {L} is implemented.
    risky: There is a 1/3 probability that 600 people will be rescued and a 2/3 probability that no people will be rescued if Program {L} is implemented.
  x0:
    name: loss
    labels:
    - C
    - D
    sure: 400 people will perish if Program {L} is implemented.
    risky: There is a 1/3 probability that no people will perish and a 2/3 probability that 600 people will perish if Program {L} is implemented.
order_note: O=sure_first puts the sure program on the first label; O=risky_first swaps the two lines (labels stay in order).
