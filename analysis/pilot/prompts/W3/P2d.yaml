paradigm: P2d
wording: W3
response_type: number
intro: We are interested in what people believe about the world around them. Please estimate the answer to the question below, and if you do not know it, just give your best guess.
conditions:
  x1: Consider the number of babies born per day in the United States, which is less than 50,000. How many babies do you think are born in the U.S. each day?
  x0: Consider the number of babies born per day in the United States, which is more than 100. How many babies do you think are born in the U.S. each day?
condition_names:
  x1: high anchor
  x0: low anchor
