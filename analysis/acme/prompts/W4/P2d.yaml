paradigm: P2d
wording: W4
response_type: number
intro: People's beliefs about the world around them are of interest to us. For the following question, a best estimate is requested from you. If the correct answer is not known to you, just give your best guess.
conditions:
  x1: Fewer than 50,000 babies are born in the United States per day. How many babies do you think are born there per day?
  x0: More than 100 babies are born in the United States per day. How many babies do you think are born there per day?
condition_names:
  x1: high anchor
  x0: low anchor
baseline: How many babies do you think are born in the United States per day?
