paradigm: P1
wording: W8
response_type: choice
stem: 'Preparing for the outbreak of an unusual disease, which is expected to kill 600 people, the United States has before it two alternative programs to fight the disease. It is to be assumed that the exact scientific estimates of the consequences of the programs are as follows:'
question: Between the two programs, which would you choose?
frames:
  x1:
    name: gain
    labels:
    - A
    - B
    sure: Should Program {L} be adopted, 200 people will be saved.
    risky: Should Program {L} be adopted, there is a 1/3 probability that 600 people will be saved and a 2/3 probability that no people will be saved.
  x0:
    name: loss
    labels:
    - C
    - D
    sure: Should Program {L} be adopted, 400 people will die.
    risky: Should Program {L} be adopted, there is a 1/3 probability that no people will die and a 2/3 probability that 600 people will die.
order_note: O=sure_first puts the sure program on the first label; O=risky_first swaps the two lines (labels stay in order).
