paradigm: P3
wording: W4
response_type: rating
conditions:
  x1: Imagine that an important game is being played by your favorite football team. A ticket to the game has been paid for handsomely by you. However, on the day of the game, it happens to be freezing cold. What do you do?
  x0: Imagine that an important game is being played by your favorite football team. A ticket to the game has been received by you for free from a friend. However, on the day of the game, it happens to be freezing cold. What do you do?
condition_names:
  x1: paid ticket
  x0: free ticket
scale: 'A 9-point scale is to be used: 1 = Definitely stay at home, 9 = Definitely go to the game.'
scale_reversed: 'A 9-point scale is to be used: 1 = Definitely go to the game, 9 = Definitely stay at home.'
