paradigm: P1
wording: W3
response_type: choice
stem: 'The United States is bracing for an outbreak of an unusual disease, which is expected to kill 600 people. Two alternative programs to combat the disease are under consideration. Assume that the exact scientific estimates of the outcomes are as follows:'
question: Which program would you pick?
frames:
  x1:
    name: gain
    labels:
    - A
    - B
    sure: With Program {L}, 200 people will be saved.
    risky: With Program {L}, there is 1/3 probability that 600 people will be saved and 2/3 probability that no people will be saved.
  x0:
    name: loss
    labels:
    - C
    - D
    sure: With Program {L}, 400 people will die.
    risky: With Program {L}, there is 1/3 probability that no people will die and 2/3 probability that 600 people will die.
order_note: O=sure_first puts the sure program on the first label; O=risky_first swaps the two lines (labels stay in order).
