paradigm: P3
wording: D1
response_type: rating
conditions:
  x1: Imagine that your favorite football team is playing an important game. You have a ticket to the game that you have paid almost nothing for. However, on the day of the game, it happens to be freezing cold. What do you do?
  x0: Imagine that your favorite football team is playing an important game. You have a ticket to the game that you have received for free from a friend. However, on the day of the game, it happens to be freezing cold. What do you do?
