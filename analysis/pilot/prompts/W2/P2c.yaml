paradigm: P2c
wording: W2
response_type: number
intro: This question is about people's beliefs about the world around them. Give your best estimate. If you do not know the correct answer, simply give your best guess.
conditions:
  x1: The height of Mount Everest is below 45,500 feet. What is your best estimate of how tall it is?
  x0: The height of Mount Everest is above 2,000 feet. What is your best estimate of how tall it is?
condition_names:
  x1: high anchor
  x0: low anchor
