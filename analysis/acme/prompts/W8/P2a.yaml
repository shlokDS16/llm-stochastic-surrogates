paradigm: P2a
wording: W8
response_type: number
intro: Should you not know the correct answer, simply give your best guess. People's beliefs about the world around them are of interest to us, and for the following question we ask that you give your best estimate.
conditions:
  x1: Shorter than 6,000 miles is the distance from San Francisco to New York City. How far do you think it is?
  x0: Longer than 1,500 miles is the distance from San Francisco to New York City. How far do you think it is?
condition_names:
  x1: high anchor
  x0: low anchor
baseline: From San Francisco to New York City, how many miles do you think it is?
