paradigm: P2a
wording: W6
response_type: number
intro: We're curious about what people believe about the world around them. For this question, a best estimate is what's wanted from you. If the correct answer isn't known to you, just give your best guess.
conditions:
  x1: San Francisco and New York City are separated by a distance that's shorter than 6,000 miles. How far do you think that is?
  x0: San Francisco and New York City are separated by a distance that's longer than 1,500 miles. How far do you think that is?
condition_names:
  x1: high anchor
  x0: low anchor
baseline: So how far do you think it is from San Francisco to New York City, in miles?
