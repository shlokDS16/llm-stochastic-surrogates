paradigm: P1
wording: W6
response_type: choice
stem: 'Say the United States is preparing for the outbreak of an unusual disease, and 600 people are expected to be killed by it. Two alternative programs to fight the disease have been proposed. Let''s assume the exact scientific estimates of the consequences of the programs are these:'
question: Which program would be picked by you, then?
frames:
  x1:
    name: gain
    labels:
    - A
    - B
    sure: If Program {L} gets adopted, 200 people will be saved.
    risky: If Program {L} gets adopted, there's a 1/3 probability that 600 people will be saved and a 2/3 probability that no people will be saved.
  x0:
    name: loss
    labels:
    - C
    - D
    sure: If Program {L} gets adopted, 400 people will die.
    risky: If Program {L} gets adopted, there's a 1/3 probability that no people will die and a 2/3 probability that 600 people will die.
order_note: O=sure_first puts the sure program on the first label; O=risky_first swaps the two lines (labels stay in order).
