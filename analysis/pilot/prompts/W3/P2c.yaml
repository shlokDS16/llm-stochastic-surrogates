paradigm: P2c
wording: W3
response_type: number
intro: We are interested in what people believe about the world around them. Please estimate the answer to the question below, and if you do not know it, just give your best guess.
conditions:
  x1: Consider Mount Everest, which is shorter than 45,500 feet. How tall do you think it is?
  x0: Consider Mount Everest, which is taller than 2,000 feet. How tall do you think it is?
condition_names:
  x1: high anchor
  x0: low anchor
