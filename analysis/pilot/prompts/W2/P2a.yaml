paradigm: P2a
wording: W2
response_type: number
intro: This question is about people's beliefs about the world around them. Give your best estimate. If you do not know the correct answer, simply give your best guess.
conditions:
  x1: The distance between San Francisco and New York City is less than 6,000 miles. What is your best estimate of that distance?
  x0: The distance between San Francisco and New York City is more than 1,500 miles. What is your best estimate of that distance?
condition_names:
  x1: high anchor
  x0: low anchor
