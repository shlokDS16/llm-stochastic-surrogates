paradigm: P1
wording: W1
response_type: choice
stem: 'Suppose the United States is getting ready for an outbreak of an unusual disease that is expected to kill 600 people. Two different programs to combat the disease have been proposed. Assume that the exact scientific estimates of what the programs would achieve are as follows:'
question: Which of the two programs would you choose?
frames:
  x1:
    name: gain
    labels:
    - A
    - B
    sure: Program {L} would save 200 people.
    risky: Program {L} has a 1/3 probability of saving all 600 people and a 2/3 probability of saving no one.
  x0:
    name: loss
    labels:
    - C
    - D
    sure: Under Program {L}, 400 people would die.
    risky: Under Program {L}, there is a 1/3 probability that no one would die and a 2/3 probability that all 600 people would die.
order_note: O=sure_first puts the sure program on the first label; O=risky_first swaps the two lines (labels stay in order).
