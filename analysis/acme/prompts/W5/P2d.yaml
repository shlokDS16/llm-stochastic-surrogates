paradigm: P2d
wording: W5
response_type: number
intro: The beliefs that people hold about the world around them are of interest to us. For the question below, your most accurate estimate is requested. Should the correct answer be unknown to you, you are asked simply to offer your best conjecture.
conditions:
  x1: In the United States, fewer than 50,000 infants are born daily. What is your estimate of the number of infants born in the U.S. each day?
  x0: In the United States, more than 100 infants are born daily. What is your estimate of the number of infants born in the U.S. each day?
condition_names:
  x1: high anchor
  x0: low anchor
baseline: What is your estimate of the number of infants born in the United States each day?
