paradigm: P2c
wording: W6
response_type: number
intro: We're curious about what people believe about the world around them. For this question, a best estimate is what's wanted from you. If the correct answer isn't known to you, just give your best guess.
conditions:
  x1: Mount Everest's been measured as shorter than 45,500 feet. How tall do you think it is?
  x0: Mount Everest's been measured as taller than 2,000 feet. How tall do you think it is?
condition_names:
  x1: high anchor
  x0: low anchor
baseline: So how tall do you think Mount Everest is, in feet?
