paradigm: P3
wording: W8
response_type: rating
conditions:
  x1: On the day of an important game for your favorite football team, the weather happens to be freezing cold. You have a ticket to the game for which you paid handsomely. What do you do?
  x0: On the day of an important game for your favorite football team, the weather happens to be freezing cold. You have a ticket to the game that you received for free from a friend. What do you do?
condition_names:
  x1: paid ticket
  x0: free ticket
scale: Please respond on a 9-point scale, wherein 1 = Definitely stay at home and 9 = Definitely go to the game.
scale_reversed: Please respond on a 9-point scale, wherein 1 = Definitely go to the game and 9 = Definitely stay at home.
